services:
  weaver:
    image: weaver-hackathon:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      WEAVER_DATA_DIR: /app/data
      WEAVER_MAX_CONCURRENT_RUNS: 3
      WEAVER_PREVIEW_CONCURRENCY: 2
      WEAVER_PREVIEW_LIMIT: 12
    volumes:
      - weaver-data:/app/data
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    # One Chromium is tens of processes, so parallel dealer crawls hit the
    # PID ceiling long before CPU or memory: at three concurrent crawls the
    # container sat at exactly 256/256 pids and the shell could not even fork
    # (2026-08-29), while the 12-core host idled at 0.66 load.
    pids_limit: 2048
    # Sticky-browser dealer crawls render hundreds of heavy SPA pages through
    # one Chromium; a 2g cgroup OOM-killed the browser mid-run (2026-08-28).
    mem_limit: 12g
    cpus: 6.0
    shm_size: 2gb
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m

  # Required when AutoPosting's background-sync rollout is enabled. The public
  # start/status routes are database-only and fail closed without this sidecar's
  # recent successful heartbeat. Enable explicitly with:
  # docker compose --profile autoposting up -d
  weaver-reaper:
    image: weaver-hackathon:local
    build: .
    profiles:
      - autoposting
    restart: unless-stopped
    command: ["python", "-m", "weaver.autoposting_reaper"]
    healthcheck:
      # The image-level probe targets the API port only the web service
      # serves; the reaper is a headless loop with nothing to probe.
      disable: true
    environment:
      AUTOPOSTING_REAPER_BASE_URL: ${AUTOPOSTING_REAPER_BASE_URL:-https://www.autopostingpro.com}
      AUTOPOSTING_REAPER_SECRET: ${AUTOPOSTING_REAPER_SECRET:-}
      AUTOPOSTING_REAPER_INTERVAL_SECONDS: ${AUTOPOSTING_REAPER_INTERVAL_SECONDS:-30}
      # Customer→factory feedback loop (opt-in). Set the factory base to the
      # compose-internal weaver service to arm the referral pass; the token is
      # the BOX's own WEAVER_API_TOKEN (from .env), which never leaves this
      # network — the web app cannot push here, so the reaper files locally.
      AUTOPOSTING_REAPER_FACTORY_BASE_URL: ${AUTOPOSTING_REAPER_FACTORY_BASE_URL:-}
      WEAVER_API_TOKEN: ${WEAVER_API_TOKEN:-}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.15
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m

volumes:
  weaver-data:
