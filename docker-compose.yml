services:
  weaver:
    image: weaver-hackathon:local
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      WEAVER_DATA_DIR: /app/data
      WEAVER_MAX_CONCURRENT_RUNS: 3
      WEAVER_PREVIEW_CONCURRENCY: 2
      WEAVER_PREVIEW_LIMIT: 12
    volumes:
      - weaver-data:/app/data
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m

volumes:
  weaver-data:
